80" stroke-width="1.6" marker-end="url(#a)"/><line x1="431.0" y1="115.0" x2="489.0" y2="115.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><text x="460.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#6b7480">fetch / JSON</text><line x1="669.0" y1="115.0" x2="727.0" y2="115.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><text x="460.0" y="235" text-anchor="middle" font-size="12" fill="#6b7480">Docker Compose : conteneur app (Apache + PHP 8.3) et conteneur db (MySQL 8) · tests d’intégration HTTP PHPUnit sur une base dédiée</text></svg>
