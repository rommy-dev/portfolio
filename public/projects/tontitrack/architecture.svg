<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Architecture de TontiTrack">
<title>Architecture de TontiTrack</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker></defs>
<rect width="920" height="410" rx="14" fill="#ffffff"/><rect x="40.0" y="40" width="220" height="150" rx="10" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1.5"/><text x="150.0" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2230">Navigateur</text><text x="150.0" y="88" text-anchor="middle" font-size="12.5" fill="#4a5363">client React (Vite)</text><text x="150.0" y="106" text-anchor="middle" font-size="12.5" fill="#4a5363">Zustand, React Query</text><rect x="350.0" y="40" width="220" height="150" rx="10" fill="#fff4ee" stroke="#ff8a5c" stroke-width="1.5"/><text x="460.0" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2230">API Express</text><text x="460.0" y="88" text-anchor="middle" font-size="12.5" fill="#4a5363">contrôleur → service</text><text x="460.0" y="106" text-anchor="middle" font-size="12.5" fill="#4a5363">→ modèle Mongoose</text><text x="460.0" y="124" text-anchor="middle" font-size="12.5" fill="#4a5363">JWT + cookie httpOnly</text><rect x="660.0" y="40" width="220" height="150" rx="10" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1.5"/><text x="770.0" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2230">MongoDB Atlas</text><text x="770.0" y="88" text-anchor="middle" font-size="12.5" fill="#4a5363">clusters dev et prod</text><text x="770.0" y="106" text-anchor="middle" font-size="12.5" fill="#4a5363">séparés</text><line x1="262.0" y1="115" x2="348.0" y2="115" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><text x="305.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#6b7480">HTTPS / JSON</text><line x1="572.0" y1="115" x2="658.0" y2="115" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><text x="615.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#6b7480">Mongoose</text><rect x="40.0" y="240" width="220" height="100" rx="10" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1.5"/><text x="150.0" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2230">Nginx (Docker)</text><text x="150.0" y="288" text-anchor="middle" font-size="12.5" fill="#4a5363">sert les fichiers</text><text x="150.0" y="306" text-anchor="middle" font-size="12.5" fill="#4a5363">statiques du client</text><line x1="150.0" y1="238" x2="150.0" y2="192" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="350.0" y="240" width="220" height="100" rx="10" fill="#f6f7f9" stroke="#c9ced6" stroke-width="1.5"/><text x="460.0" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2230">Tâches cron</text><text x="460.0" y="288" text-anchor="middle" font-size="12.5" fill="#4a5363">cycles, pénalités,</text><text x="460.0" y="306" text-anchor="middle" font-size="12.5" fill="#4a5363">rappels, nettoyage</text><line x1="460.0" y1="238" x2="460.0" y2="192" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><text x="460.0" y="385" text-anchor="middle" font-size="12" fill="#6b7480">Client et API déployés comme deux services Render · tests sur MongoMemoryServer</text></svg>
